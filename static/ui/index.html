<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Chat</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bubble: #1e3a5f;
      --assistant-bubble: #243044;
      --danger: #ef4444;
      --radius: 10px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    #app { display: flex; min-height: 100vh; }
    .hidden { display: none !important; }

    /* Auth */
    #auth-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }
    .auth-card h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .auth-card p { margin: 0 0 24px; color: var(--muted); font-size: 0.9rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tabs button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }
    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 12px;
    }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: -8px; margin-bottom: 12px; min-height: 1.2em; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 16px; line-height: 1.4; }
    .hint a { color: var(--accent); }

    /* Main layout */
    #chat-screen { display: flex; flex: 1; min-height: 0; }
    aside {
      width: 280px;
      min-width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    aside header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    aside header span { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-sm {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    #chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      font-size: 0.9rem;
    }
    .chat-item:hover { background: rgba(255,255,255,0.04); }
    .chat-item.active { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); }
    .chat-item-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-item-delete {
      flex-shrink: 0;
      padding: 4px 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
    }
    .chat-item:hover .chat-item-delete,
    .chat-item.active .chat-item-delete { opacity: 1; }
    .chat-item-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
    }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user { align-self: flex-end; background: var(--user-bubble); border: 1px solid var(--border); }
    .bubble.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); }
    .bubble .role { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
    #composer-wrap {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    #composer { display: flex; gap: 12px; align-items: flex-end; }
    #composer textarea {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    #composer .btn { width: auto; min-width: 100px; }
    #empty-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }
    #chat-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="auth-screen">
      <div class="auth-card">
        <h1>LLM Chat</h1>
        <p>Local model · Sign in to start</p>
        <div class="tabs">
          <button type="button" id="tab-login" class="active">Login</button>
          <button type="button" id="tab-register">Register</button>
        </div>
        <div id="panel-login">
          <label for="login-user">Username</label>
          <input id="login-user" autocomplete="username" />
          <label for="login-pass">Password</label>
          <input id="login-pass" type="password" autocomplete="current-password" />
          <div class="error-msg" id="login-error"></div>
          <button class="btn" id="btn-login">Log in</button>
        </div>
        <div id="panel-register" class="hidden">
          <label for="reg-user">Username</label>
          <input id="reg-user" autocomplete="username" />
          <label for="reg-pass">Password (min 8)</label>
          <input id="reg-pass" type="password" autocomplete="new-password" />
          <div class="error-msg" id="reg-error"></div>
          <button class="btn" id="btn-register">Create account</button>
        </div>
        <p class="hint">API docs: <a href="/docs" target="_blank" rel="noopener">/docs</a>. GitHub OAuth returns JSON at callback—use password login here.</p>
      </div>
    </div>

    <div id="chat-screen" class="hidden">
      <aside>
        <header>
          <span id="whoami"></span>
          <button type="button" class="btn btn-sm btn-secondary" id="btn-logout">Out</button>
        </header>
        <div style="padding: 8px 12px;">
          <button type="button" class="btn btn-sm" id="btn-new-chat">+ New chat</button>
        </div>
        <div id="chat-list"></div>
      </aside>
      <main>
        <div id="empty-main">Select a chat or create one.</div>
        <div id="chat-main" class="hidden">
          <div id="messages"></div>
          <div id="composer-wrap">
            <div id="composer">
              <textarea id="msg-input" rows="2" placeholder="Message the model…"></textarea>
              <button class="btn" id="btn-send">Send</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let accessToken = localStorage.getItem("access_token");
    let refreshToken = localStorage.getItem("refresh_token");

    async function readErrorJson(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        return { detail: text ? text.slice(0, 400) : res.statusText };
      }
    }

    function formatDetail(err) {
      if (!err) return "Request failed";
      const d = err.detail;
      if (d == null) return err.message ? String(err.message) : "Request failed";
      if (typeof d === "string") return d;
      if (Array.isArray(d)) {
        return d
          .map(function (item) {
            if (typeof item === "string") return item;
            if (item && item.msg) return item.msg;
            return JSON.stringify(item);
          })
          .join(" · ");
      }
      return typeof d === "object" ? JSON.stringify(d) : String(d);
    }

    function saveTokens(a, r) {
      accessToken = a;
      refreshToken = r;
      if (a) localStorage.setItem("access_token", a);
      else localStorage.removeItem("access_token");
      if (r) localStorage.setItem("refresh_token", r);
      else localStorage.removeItem("refresh_token");
    }

    async function tryRefresh() {
      if (!refreshToken) return false;
      const res = await fetch("/auth/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refreshToken }),
      });
      if (!res.ok) return false;
      const data = await res.json();
      saveTokens(data.access_token, data.refresh_token);
      return true;
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (accessToken) headers["Authorization"] = "Bearer " + accessToken;
      if (options.body && typeof options.body === "object" && !(options.body instanceof FormData)) {
        headers["Content-Type"] = "application/json";
        options = { ...options, body: JSON.stringify(options.body) };
      }
      let res = await fetch(path, { ...options, headers });
      if (res.status === 401 && accessToken) {
        if (await tryRefresh()) {
          headers["Authorization"] = "Bearer " + accessToken;
          res = await fetch(path, { ...options, headers });
        }
      }
      return res;
    }

    function showAuth() {
      $("auth-screen").classList.remove("hidden");
      $("chat-screen").classList.add("hidden");
    }

    function showChat() {
      $("auth-screen").classList.add("hidden");
      $("chat-screen").classList.remove("hidden");
    }

    let currentChatId = null;

    function setError(el, msg) {
      $(el).textContent = msg || "";
    }

    $("tab-login").onclick = () => {
      $("tab-login").classList.add("active");
      $("tab-register").classList.remove("active");
      $("panel-login").classList.remove("hidden");
      $("panel-register").classList.add("hidden");
    };
    $("tab-register").onclick = () => {
      $("tab-register").classList.add("active");
      $("tab-login").classList.remove("active");
      $("panel-register").classList.remove("hidden");
      $("panel-login").classList.add("hidden");
    };

    $("btn-login").onclick = async () => {
      setError("login-error", "");
      const login = $("login-user").value.trim();
      const password = $("login-pass").value;
      if (!login || !password) {
        setError("login-error", "Fill all fields");
        return;
      }
      $("btn-login").disabled = true;
      let res;
      try {
        res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login, password }),
        });
      } catch (e) {
        $("btn-login").disabled = false;
        setError("login-error", "Cannot reach server. Is uvicorn running?");
        return;
      }
      $("btn-login").disabled = false;
      if (!res.ok) {
        const err = await readErrorJson(res);
        setError("login-error", formatDetail(err));
        return;
      }
      const data = await res.json();
      saveTokens(data.access_token, data.refresh_token);
      localStorage.setItem("login_name", login);
      await enterApp();
    };

    $("btn-register").onclick = async () => {
      setError("reg-error", "");
      const login = $("reg-user").value.trim();
      const password = $("reg-pass").value;
      if (!login || password.length < 8) {
        setError("reg-error", "Username required, password min 8 chars");
        return;
      }
      $("btn-register").disabled = true;
      let res;
      try {
        res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login, password }),
        });
      } catch (e) {
        $("btn-register").disabled = false;
        setError("reg-error", "Cannot reach server. Is uvicorn running on this host/port?");
        return;
      }
      $("btn-register").disabled = false;
      if (!res.ok) {
        const err = await readErrorJson(res);
        setError("reg-error", formatDetail(err));
        return;
      }
      $("tab-login").click();
      $("login-user").value = login;
      $("login-pass").value = password;
      setError("login-error", "Account created — log in.");
    };

    $("btn-logout").onclick = () => {
      saveTokens(null, null);
      localStorage.removeItem("login_name");
      currentChatId = null;
      showAuth();
    };

    async function loadChats() {
      const res = await api("/chats");
      if (!res.ok) return;
      const chats = await res.json();
      const list = $("chat-list");
      list.innerHTML = "";
      chats.forEach((c) => {
        const div = document.createElement("div");
        div.className = "chat-item" + (c.id === currentChatId ? " active" : "");
        div.dataset.id = String(c.id);
        div.onclick = () => openChat(c.id, div);
        const title = document.createElement("span");
        title.className = "chat-item-title";
        title.textContent = c.title || "Chat " + c.id;
        const del = document.createElement("button");
        del.type = "button";
        del.className = "chat-item-delete";
        del.title = "Delete chat";
        del.setAttribute("aria-label", "Delete chat");
        del.textContent = "×";
        del.onclick = (e) => {
          e.stopPropagation();
          deleteChat(c.id);
        };
        div.appendChild(title);
        div.appendChild(del);
        list.appendChild(div);
      });
    }

    async function deleteChat(id) {
      if (!confirm("Delete this chat and all its messages?")) return;
      const res = await api("/chats/" + id, { method: "DELETE" });
      if (!res.ok && res.status !== 204) {
        alert("Could not delete chat");
        return;
      }
      if (currentChatId === id) {
        currentChatId = null;
        $("messages").innerHTML = "";
        $("empty-main").classList.remove("hidden");
        $("chat-main").classList.add("hidden");
      }
      await loadChats();
    }

    async function openChat(id, el) {
      currentChatId = id;
      document.querySelectorAll(".chat-item").forEach((n) => n.classList.remove("active"));
      if (el) el.classList.add("active");
      $("empty-main").classList.add("hidden");
      $("chat-main").classList.remove("hidden");
      const res = await api("/chats/" + id + "/messages");
      if (!res.ok) {
        const err = await readErrorJson(res);
        $("messages").innerHTML =
          "<p style='color:var(--danger)'>Could not load messages: " +
          escapeHtml(formatDetail(err)) +
          "</p>";
        return;
      }
      const msgs = await res.json();
      const box = $("messages");
      box.innerHTML = "";
      msgs.forEach((m) => appendBubble(m.role, m.content));
      box.scrollTop = box.scrollHeight;
    }

    function appendBubble(role, content) {
      const div = document.createElement("div");
      div.className = "bubble " + (role === "user" ? "user" : "assistant");
      div.innerHTML = "<div class='role'>" + role + "</div>" + escapeHtml(content);
      $("messages").appendChild(div);
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    $("btn-new-chat").onclick = async () => {
      const res = await api("/chats", { method: "POST", body: {} });
      if (!res.ok) {
        alert("Could not create chat");
        return;
      }
      const c = await res.json();
      await loadChats();
      const el = document.querySelector('.chat-item[data-id="' + c.id + '"]');
      if (el) el.click();
    };

    $("btn-send").onclick = sendMessage;
    $("msg-input").onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    async function sendMessage() {
      const input = $("msg-input");
      const text = input.value.trim();
      if (!text || !currentChatId) return;
      input.value = "";
      appendBubble("user", text);
      const box = $("messages");
      box.scrollTop = box.scrollHeight;
      $("btn-send").disabled = true;
      const res = await api("/chats/" + currentChatId + "/messages", {
        method: "POST",
        body: { content: text },
      });
      $("btn-send").disabled = false;
      if (!res.ok) {
        const err = await readErrorJson(res);
        appendBubble("assistant", "Error: " + formatDetail(err));
        box.scrollTop = box.scrollHeight;
        return;
      }
      const data = await res.json();
      appendBubble("assistant", data.assistant_message.content);
      box.scrollTop = box.scrollHeight;
    }

    async function enterApp() {
      showChat();
      $("whoami").textContent = localStorage.getItem("login_name") || "User";
      await loadChats();
    }

    async function boot() {
      if (accessToken) {
        const res = await api("/chats");
        if (res.ok) {
          await enterApp();
          return;
        }
      }
      showAuth();
    }

    boot();
  </script>
</body>
</html>
